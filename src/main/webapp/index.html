<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>Notebook App</title>
	<link rel="stylesheet" href="css/style.css">
</head>

<body>
	<div id="app-loader"
		style="position:fixed; inset:0; background:white; z-index:9999; display:flex; align-items:center; justify-content:center;">
		<h3>Loading...</h3>
	</div>


	<div id="home-view" class="view hide">
		<div id="welcome-section" class="welcome-card">
			<h1>Welcome, <span id="welcome-name"></span>!</h1>
			<p>You are successfully logged in.</p>
			<div class="dashboard-actions">
				<button onclick="location.hash='profile'" class="btn-primary">Manage Profile</button>
				<button onclick="location.hash='notebooks'" class="btn-primary" style="margin-top:10px;">Manage
					Notebooks</button>
				<button onclick="doLogout()" class="btn-danger">Logout</button>
			</div>
		</div>
	</div>

	<div id="notebooks-view" class="view hide" style="max-width: 900px;">
		<div class="header-row">
			<h2>My Notebooks</h2>
			<button onclick="location.hash='home'" class="btn-secondary">Back to Dashboard</button>
		</div>
		<div class="section">
			<div style="text-align: right; margin-bottom: 15px;">
				<button onclick="createNotebook()" class="add-btn" style="width: auto;">+ Create Notebook</button>
			</div>
			<div id="notebook-grid" class="notebook-grid"></div>
		</div>
	</div>

	<!-- FIXED: was notes-list-view-view -->
	<div id="notes-list-view" class="view hide" style="max-width: 900px;">
		<div class="header-row">
			<h2 id="notes-list-notebook-title">Notebook</h2>
			<button onclick="location.hash='notebooks'" class="btn-secondary">Back to Notebooks</button>
		</div>
		<div class="section">
			<div style="text-align: right; margin-bottom: 15px;">
				<button onclick="createNote()" class="add-btn" style="width: auto;">+ Create Note</button>
			</div>
			<div id="notes-list-container" class="notes-list-container">
				<p>Loading notes...</p>
			</div>
		</div>
	</div>

	<!-- FIXED: was note-detail-view-view -->
	<div id="note-detail-view" class="view hide" style="max-width: 900px;">
		<div class="header-row">
			<h2 id="note-detail-title">Note</h2>
			<button onclick="location.hash='notebooks/' + currentNotebookId + '/notes'" class="btn-secondary">Back to
				Notes</button>
		</div>
		<div class="section">
			<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
				<span id="note-detail-pinned" class="pin-badge"></span>
				<div style="display:flex; gap:10px;">
					<button onclick="editNoteDetail()" class="btn-edit" style="width:auto;">Edit</button>
					<button onclick="deleteNoteDetail()" class="btn-danger" style="width:auto;">Delete</button>
				</div>
			</div>
			<p id="note-detail-content" style="white-space:pre-wrap; font-size:15px; color:#333; line-height:1.6;"></p>
			<div style="margin-top:20px; font-size:12px; color:#999;">
				<span id="note-detail-created"></span>&nbsp;&nbsp;
				<span id="note-detail-updated"></span>
			</div>
		</div>
	</div>

	<div id="profile-view" class="view hide">
		<div class="header-row">
			<h2>Manage Profile</h2>
			<button onclick="location.hash='home'" class="btn-secondary">Back to Dashboard</button>
		</div>
		<div class="section">
			<h3>Personal Details <button onclick="saveProfile()" class="save-btn">Save</button></h3>
			<table class="details-table">
				<tbody>
					<tr>
						<th width="150">Name</th>
						<td><input id="p_name" placeholder="Display Name"></td>
					</tr>
					<tr>
						<th>Time Zone</th>
						<td><select id="p_timezone"
								style="width: 100%; border: none; background: transparent;"></select></td>
					</tr>
				</tbody>
			</table>
		</div>
		<div class="section">
			<h3>Emails <button onclick="addContact('email')" class="add-btn">+ Add</button></h3>
			<table>
				<thead>
					<tr>
						<th>Email Address</th>
						<th width="120">Status</th>
					</tr>
				</thead>
				<tbody id="email-list"></tbody>
			</table>
		</div>
		<div class="section">
			<h3>Phones <button onclick="addContact('phone')" class="add-btn">+ Add</button></h3>
			<table>
				<thead>
					<tr>
						<th>Phone Number</th>
						<th width="120">Status</th>
					</tr>
				</thead>
				<tbody id="phone-list"></tbody>
			</table>
		</div>
	</div>

	<div id="phone-modal" class="modal-overlay hide">
		<div class="modal-content" style="width:300px;">
			<h3>Add Phone Number</h3>
			<select id="p_add_country_code" style="width:100%; margin-bottom:10px;"></select>
			<input id="p_add_phone_val" placeholder="Phone Number" style="width:100%; margin-bottom:10px;">
			<div style="display:flex; gap:10px;">
				<button onclick="submitPhoneContact()" class="btn-primary" style="flex:1">Add</button>
				<button onclick="closePhoneModal()" class="btn-secondary" style="flex:1">Cancel</button>
			</div>
		</div>
	</div>

	<div id="note-modal" class="modal-overlay hide">
		<div class="modal-content" style="width:400px;">
			<h3 id="modal-title">Create New Note</h3>
			<input id="modal-note-title" type="text" placeholder="Note Title">
			<textarea id="modal-note-content" placeholder="Write your thoughts here..."></textarea>
			<div style="display:flex; align-items:center; gap:8px; margin:10px 0;">
				<input id="modal-note-pinned" type="checkbox" style="width:auto; margin:0; display:inline-block;">
				<label for="modal-note-pinned" style="font-size:14px; color:#555; margin:0;">Pin this note</label>
			</div>
			<div style="display:flex; gap:10px; margin-top:10px;">
				<button id="modal-save-btn" class="btn-primary" style="flex:1">Save Note</button>
				<button onclick="closeNoteModal()" class="btn-secondary" style="flex:1">Cancel</button>
			</div>
		</div>
	</div>

	<script src="js/app.js"></script>
</body>

</html>

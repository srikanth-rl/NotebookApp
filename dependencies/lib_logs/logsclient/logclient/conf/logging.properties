# $Id$
## Setting multiple FileHandlers
###########################################
handlers=com.zoho.logs.logclient.logger.ApplicationLogHandler, java.util.logging.FileHandler

## root handlers
###########################################

.handlers=com.zoho.logs.logclient.logger.ApplicationLogHandler


.level=INFO
com.adventnet.cache.level=SEVERE
org.apache.commons.httpclient.auth.level=WARNING
com.zoho.instrument.transport.UDPClient.level=SEVERE
com.zoho.ear.common.util.KeyUtil.level=WARNING
com.zoho.ear.agent.util.KeyUtil.level=WARNING
org.apache.kafka.clients.level=WARNING
org.apache.kafka.common.utils.level=WARNING
com.zoho.ear.encryptagent.EncryptAgent.level=WARNING
com.zoho.scheduler.JobWrapper.level=WARNING
org.apache.hadoop.net.NetworkTopology.level=WARNING

## Handler Specific Properties 
#########################################################

com.zoho.logs.config.project.name=<PROJECT>
com.zoho.logs.config.service.name=<SERVICE>

#To enable Local Logging 
#com.zoho.logs.config.local.logging=true

#Implement a custom LogListener to handle large logs 
com.zoho.logs.config.log.listener.truncate=com.zoho.logs.logclient.v2.listener.NoOPLogListener


com.zoho.logs.config.zlogs.domain=https://agent.zohologs.com
# $Id$
## Setting multiple FileHandlers
###########################################
handlers=com.zoho.logs.logclient.logger.ApplicationLogHandler


com.zoho.logs.config.project.name=PROJECT
com.zoho.logs.config.service.name=SERVICE
com.zoho.logs.config.zlogs.domain=https://agent.zohologs.com

com.zoho.logs.config.log.listener.truncate=com.zoho.logs.logclient.v2.listener.NoOPLogListener

com.zoho.logs.config.logs.directory=../../logs/

com.zoho.logs.config.build.version.path=BUILD_PATH

com.zoho.logs.config.authentication.mechanism=AUTH_MECHANISM
com.zoho.logs.config.api.client.id=CLIENT_ID
com.zoho.logs.config.api.client.secret=CLIENT_SECRET
com.zoho.logs.config.api.refresh.token=REFRESH_TOKEN
com.zoho.logs.config.iam.domain=IAM_DOMAIN
com.zoho.logs.config.api.key=AGENT_API_KEY

com.zoho.logs.config.queue.type=LBQUEUE
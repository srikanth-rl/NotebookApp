# Global Configuration
product_name=NoteBook
product_version=1.0
zip_name=${product_name}.zip

# Execution Sequence
local_order=clean,compile,makewar,deploy,createzip,final_clean

# Order of Operations
clean_order=mkdir:stage_root,mkdir:classes,mkdir:sas_staging,mkdir:war_root,mkdir:war_WEB_INF,deletetask:clean_stage
compile_order=srccompile:constants,srccompile:enums,srccompile:model,srccompile:context,srccompile:dto,srccompile:cache,srccompile:dao,srccompile:util,srccompile:service,srccompile:controller,srccompile:filter
makewar_order=copytask:copy_sas_framework,copytask:copy_sas_libs,copytask:copy_all_nb_jars,copytask:copy_res,copytask:copy_web,copyfiletask:copy_module_xml,copyfiletask:copy_data_dict,genjar:warfile
deploy_order=copyfiletask:place_in_tomcat
createzip_order=genzip:output
final_clean_order=deletetask:final_clean

# Directories
build_dir=.
base_dir=..
src_dir=${base_dir}/src/main/java
webapp_dir=${base_dir}/src/main/webapp
res_dir=${base_dir}/src/main/resources
base_lib_dir=${webapp_dir}/WEB-INF/lib

# Local Environment Paths
iam_local_dir=/home/sri-24601/IAM_LOCAL
sas_dir_path=${iam_local_dir}/sas
appserver_dir=${iam_local_dir}/appserver_container
tomcat_webapps_dir=${appserver_dir}/AdventNet/Sas/tomcat/webapps
servlet_jar=${appserver_dir}/AdventNet/Sas/tomcat/lib/servlet-api.jar

# Staging Areas
build_stage=${build_dir}/${product_name}_build_stage
classes_dir=${build_stage}/classes
sas_staging_dir=${build_stage}/sas_staging
war_staging=${build_stage}/war_root
web_inf_dir=${war_staging}/WEB-INF
lib_dir=${web_inf_dir}/lib

# Artifact Details
war_name=ROOT.war
base_pckg=com/zoho/notebook
notebook_module=NOTEBOOK_APP

# 1. CLEAN
stage_root_dirname=${build_stage}
classes_dirname=${classes_dir}
sas_staging_dirname=${sas_staging_dir}
war_root_dirname=${war_staging}
war_WEB_INF_dirname=${web_inf_dir}
clean_stage_deletetask=${build_stage},**,

# 2. COMPILE (Layered/Reference Style)
common_cp=${servlet_jar}:${base_lib_dir}/*.jar
comp_classes=${classes_dir}

constants_srccompile_srcdir=${src_dir}/${base_pckg}/constants
constants_srccompile_classes=${comp_classes}
constants_srccompile_classpath=${common_cp}
constants_srccompile_jar=${sas_staging_dir}/lib/nb-constants.jar

enums_srccompile_srcdir=${src_dir}/${base_pckg}/enums
enums_srccompile_classes=${comp_classes}
enums_srccompile_classpath=${common_cp}:${constants_srccompile_jar}
enums_srccompile_jar=${sas_staging_dir}/lib/nb-enums.jar

model_srccompile_srcdir=${src_dir}/${base_pckg}/model
model_srccompile_classes=${comp_classes}
model_srccompile_classpath=${common_cp}:${enums_srccompile_jar}
model_srccompile_jar=${sas_staging_dir}/lib/nb-model.jar

context_srccompile_srcdir=${src_dir}/${base_pckg}/context
context_srccompile_classes=${comp_classes}
context_srccompile_classpath=${common_cp}:${model_srccompile_jar}
context_srccompile_jar=${sas_staging_dir}/lib/nb-context.jar

dto_srccompile_srcdir=${src_dir}/${base_pckg}/dto
dto_srccompile_classes=${comp_classes}
dto_srccompile_classpath=${common_cp}:${context_srccompile_jar}
dto_srccompile_jar=${sas_staging_dir}/lib/nb-dto.jar

cache_srccompile_srcdir=${src_dir}/${base_pckg}/cache
cache_srccompile_classes=${comp_classes}
cache_srccompile_classpath=${common_cp}:${dto_srccompile_jar}
cache_srccompile_jar=${sas_staging_dir}/lib/nb-cache.jar

dao_srccompile_srcdir=${src_dir}/${base_pckg}/dao
dao_srccompile_classes=${comp_classes}
dao_srccompile_classpath=${common_cp}:${cache_srccompile_jar}
dao_srccompile_jar=${sas_staging_dir}/lib/nb-dao.jar

util_srccompile_srcdir=${src_dir}/${base_pckg}/util
util_srccompile_classes=${comp_classes}
util_srccompile_classpath=${common_cp}:${dao_srccompile_jar}
util_srccompile_jar=${sas_staging_dir}/lib/nb-util.jar

service_srccompile_srcdir=${src_dir}/${base_pckg}/service
service_srccompile_classes=${comp_classes}
service_srccompile_classpath=${common_cp}:${util_srccompile_jar}
service_srccompile_jar=${sas_staging_dir}/lib/nb-service.jar

controller_srccompile_srcdir=${src_dir}/${base_pckg}/controller
controller_srccompile_classes=${comp_classes}
controller_srccompile_classpath=${common_cp}:${service_srccompile_jar}
controller_srccompile_jar=${sas_staging_dir}/lib/nb-controller.jar

filter_srccompile_srcdir=${src_dir}/${base_pckg}/filter
filter_srccompile_classes=${comp_classes}
filter_srccompile_classpath=${common_cp}:${controller_srccompile_jar}
filter_srccompile_jar=${sas_staging_dir}/lib/nb-filter.jar

# MAKEWAR
copy_sas_framework_copytask=${sas_dir_path},${web_inf_dir},**/*
copy_sas_libs_copytask=${sas_dir_path}/lib,${lib_dir},**/*.jar
copy_all_nb_jars_copytask=${sas_staging_dir}/lib,${lib_dir},**/*.jar

copy_res_copytask=${res_dir},${web_inf_dir}/classes,**,
copy_web_copytask=${webapp_dir},${war_staging},**,

copy_module_xml_copyfiletask=${build_dir}/module.xml,${web_inf_dir}/conf/module.xml
copy_data_dict_copyfiletask=${build_dir}/data-dictionary.xml,${web_inf_dir}/conf/${notebook_module}/data-dictionary.xml

warfile_jar_file=${build_stage}/${war_name}
warfile_jar_srcdir=${war_staging}
warfile_jar_includes=**

# DEPLOY
place_in_tomcat_copyfiletask=${build_stage}/${war_name},${tomcat_webapps_dir}/${war_name}

# Create ZIP
output_genzip=${appserver_dir}/${zip_name},${build_dir}/${zip_name}

# Clean up the staging area and unnecessary build artifacts
final_clean_deletetask=${build_dir},**,*
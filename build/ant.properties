# 1. METADATA & MASTER SEQUENCES
# =============================================================================
product_name=NoteBook
product_version=1.0

local_order=clean,download,mickey,compile,jartasks,makewar,deploy,createzip,cleantasks

# Task Triggers
clean_order=deletetask:del_deps,deletetask:del_war_stage
download_order=getdep:deps
mickey_order=copytask:copy_mickey_classes,copytask:copy_mickey_conf_udt,copyfiletask:copy_mickey_runjar,copyfiletask:copy_mickey_module_xml,mkdir:makedir_mickey_conf,copyfiletask:copy_data_dictionary,copyfiletask:copy_database_params,copyfiletask:copy_configuration_properties,copyfiletask:copy_provisioning_configuration
compile_order=srccompile:all
jartasks_order=jartask:constants,jartask:enums,jartask:model,jartask:context,jartask:dto,jartask:cache,jartask:dao,jartask:util,jartask:service,jartask:controller,jartask:filter
makewar_order=copytask:copy_nb_jars_to_sas,copytask:copy_log_jars_to_sas,copytask:copy_sec_main_libs,copytask:copy_security_conf,copytask:copy_sec_extra_conf,copyfiletask:copy_config_props,copyfiletask:copy_sec_path,copyfiletask:copy_sec_props,copyfiletask:copy_logging_props_to_sas_classes,copytask:copy_res,copytask:copy_static_web,copytask:copy_sas_into_WEB_INF,copyfiletask:copy_web_xml,genjar:warfile
deploy_order=mkdir:create_logs,copyfiletask:copy_server_xml,copyfiletask:copy_tomcat_logging,copyfiletask:place_in_tomcat
createzip_order=genzip:output
cleantasks_order=deletetask:clean_local_stage

# =============================================================================
# 2. DIRECTORY STRUCTURE & PATHS
# =============================================================================
build_dir=.
base_dir=..
src_dir=${base_dir}/src/main/java
web_dir=${base_dir}/src/main/webapp
res_dir=${base_dir}/src/main/resources
base_lib_dir=${web_dir}/WEB-INF/lib

# NoteBook Build Staging
build_stage=${build_dir}/${product_name}_build_stage
compile_out=${build_stage}/classes
war_staging=${build_stage}/war_dir
war_name=ROOT.war
zip_name=${product_name}.zip
base_pckg=com/zoho/notebook

# Framework & Tomcat Paths
deps_dir=${build_dir}/dependencies
sas_dir=${deps_dir}/sas
appserver_dir=${deps_dir}/appserver_container
tomcat_dir=${appserver_dir}/AdventNet/Sas/tomcat
webapps_dir=${tomcat_dir}/webapps
logs_lib_dir=${deps_dir}/logs/logclient/lib
servlet_jar=${tomcat_dir}/lib/servlet-api.jar

# Component Paths
zohoSecurity_dir=${deps_dir}/zohoSecurity/ZohoSecurity
zohoSecurity_lib_dir=${zohoSecurity_dir}/lib
zohoSecurity_WEB_INF_dir=${zohoSecurity_dir}/webapps/WEB-INF
zohoSecurity_conf_dir=${zohoSecurity_dir}/conf
mickey_dir=${deps_dir}/mickeylite/AdventNet/MickeyLite
notebook_mickey=NOTEBOOK_MICKEY

# =============================================================================
# 3. DOWNLOAD REPOSITORY (URLs)
# =============================================================================
deps_urls=sas,appserver_container,logs,zohoSecurity,mickeylite

appserver_container=https://build.zohocorp.com/framework/saslite/milestones/channel3/appserver_container.zip
sas=https://build.zohocorp.com/framework/saslite/milestones/channel3/sas.zip
logs=https://build.zohocorp.com/framework/zohologserver/milestones/Channel3/logsclient.zip
zohoSecurity=https://build.zohocorp.com/zoho/zohosecurity/milestones/M2_36_PATCH/ZOHOSECURITY_2.36.6/ZohoSecurity.zip
mickeylite=https://build.zohocorp.com/framework/mickeylite/milestones/MICKEYLITE_1.52.0_HOTFIX_BRANCH/MICKEYLITE_FC_1.52.4/ZohoMickeyLite.zip

# =============================================================================
# PHASE 1: CLEAN
# =============================================================================
del_deps_deletetask=${build_dir},dependencies zips,
del_war_stage_deletetask=${build_dir},${product_name}_build_stage,

# =============================================================================
# PHASE 2: MICKEY PREPARATION
# =============================================================================
copy_mickey_classes_copytask=${mickey_dir}/classes,${sas_dir}/classes,**/*
copy_mickey_conf_udt_copytask=${mickey_dir}/conf/udt,${sas_dir}/conf/udt,**
copy_mickey_runjar_copyfiletask=${mickey_dir}/bin/run.jar,${sas_dir}/lib/run.jar
copy_mickey_module_xml_copyfiletask=${build_dir}/module.xml,${sas_dir}/conf/module.xml
makedir_mickey_conf_dirname=${sas_dir}/conf/${notebook_mickey}
copy_data_dictionary_copyfiletask=${build_dir}/data-dictionary.xml,${sas_dir}/conf/${notebook_mickey}/data-dictionary.xml
copy_database_params_copyfiletask=${build_dir}/database_params.conf,${sas_dir}/conf/${notebook_mickey}/database_params.conf
copy_configuration_properties_copyfiletask=${build_dir}/configuration.properties,${sas_dir}/conf/configuration.properties
copy_provisioning_configuration_copyfiletask=${build_dir}/provisioning-configuration.xml,${sas_dir}/conf/SAS/provisioning-configuration.xml

# =============================================================================
# PHASE 3: COMPILATION
# =============================================================================
all_srccompile_srcdir=${src_dir}
all_srccompile_includes=${base_pckg}/**
all_srccompile_classes=${compile_out}
all_srccompile_classpath=${servlet_jar}:${sas_dir}/lib:${logs_lib_dir}:${zohoSecurity_lib_dir}:${base_lib_dir}:${base_lib_dir}/*
all_srccompile_jar=${build_stage}/all_unused.jar

# =============================================================================
# PHASE 4: JAR TASKS (Component Creation)
# =============================================================================
constants_jartask=${sas_dir}/lib/nb-constants.jar,${compile_out},${base_pckg}/constants/**,
enums_jartask=${sas_dir}/lib/nb-enums.jar,${compile_out},${base_pckg}/enums/**,
model_jartask=${sas_dir}/lib/nb-model.jar,${compile_out},${base_pckg}/model/**,
context_jartask=${sas_dir}/lib/nb-context.jar,${compile_out},${base_pckg}/context/**,
dto_jartask=${sas_dir}/lib/nb-dto.jar,${compile_out},${base_pckg}/dto/**,
cache_jartask=${sas_dir}/lib/nb-cache.jar,${compile_out},${base_pckg}/cache/**,
dao_jartask=${sas_dir}/lib/nb-dao.jar,${compile_out},${base_pckg}/dao/**,
util_jartask=${sas_dir}/lib/nb-util.jar,${compile_out},${base_pckg}/util/**,
service_jartask=${sas_dir}/lib/nb-service.jar,${compile_out},${base_pckg}/service/**,
controller_jartask=${sas_dir}/lib/nb-controller.jar,${compile_out},${base_pckg}/controller/**,
filter_jartask=${sas_dir}/lib/nb-filter.jar,${compile_out},${base_pckg}/filter/**,

# =============================================================================
# PHASE 5: MAKEWAR (Staging & Assembly)
# =============================================================================
copy_nb_jars_to_sas_copytask=${base_lib_dir},${sas_dir}/lib,**/*.jar
copy_log_jars_to_sas_copytask=${logs_lib_dir},${sas_dir}/lib,**/*.jar

# ZohoSecurity Assembly (Flattened + Filtered)
copy_sec_main_libs_copytask=${zohoSecurity_lib_dir},${sas_dir}/lib,captcha/Filters.jar core/**.jar encoding/encoder-1.3.1.jar general/**.jar fileupload/tika-core.jar fileupload/zip*.jar xss/**.jar json/**.jar ,core/commons-validator-1.9.0.jar,flatten

copy_security_conf_copytask=${zohoSecurity_WEB_INF_dir},${sas_dir}/conf,**
copy_sec_extra_conf_copytask=${zohoSecurity_conf_dir},${sas_dir}/conf,**

copy_config_props_copyfiletask=${build_dir}/configuration.properties,${sas_dir}/conf/configuration.properties
copy_sec_path_copyfiletask=${build_dir}/security-path.xml,${sas_dir}/conf/security-path.xml
copy_sec_props_copyfiletask=${build_dir}/security-properties.xml,${sas_dir}/conf/security-properties.xml
copy_logging_props_to_sas_classes_copyfiletask=${build_dir}/logging.properties,${sas_dir}/classes/logging.properties

copy_res_copytask=${res_dir},${war_staging}/WEB-INF/classes,**,
copy_static_web_copytask=${web_dir},${war_staging},**/*.html **/*.css **/*.js,${web_dir}/WEB-INF ${web_dir}/META-INF

# Assembly Migration
copy_sas_into_WEB_INF_copytask=${sas_dir},${war_staging}/WEB-INF,**/*
copy_web_xml_copyfiletask=${web_dir}/WEB-INF/web.xml,${war_staging}/WEB-INF/web.xml

warfile_jar_file=${build_stage}/${war_name}
warfile_jar_srcdir=${war_staging}
warfile_jar_includes=**

# =============================================================================
# PHASE 6: DEPLOY & PACKAGE
# =============================================================================
create_logs_mkdir=true
create_logs_dirname=${tomcat_dir}/logs
copy_server_xml_copyfiletask=${build_dir}/tomcat_server.xml,${tomcat_dir}/conf/server.xml
copy_tomcat_logging_copyfiletask=${build_dir}/logging.properties,${tomcat_dir}/lib/logging.properties
place_in_tomcat_copyfiletask=${build_stage}/${war_name},${webapps_dir}/${war_name}

output_genzip=${deps_dir}/appserver_container/${zip_name},${appserver_dir},.

# =============================================================================
# PHASE 7: POST-BUILD CLEANUP
# =============================================================================
clean_local_stage_deletetask=${build_stage},**,
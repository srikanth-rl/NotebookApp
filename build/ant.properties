# Global
product_name=NoteBook
product_version=1.0

# Execution Sequence
# Added 'copy_security' steps into the makewar sequence
local_order=compile,jartasks,makewar,deploy,createzip,cleantasks

compile_order=srccompile:all
jartasks_order=jartask:constants,jartask:enums,jartask:model,jartask:context,jartask:dto,jartask:cache,jartask:dao,jartask:util,jartask:service,jartask:controller,jartask:filter
makewar_order=copytask:copy_res,copytask:copy_web,copytask:copy_log_jars,copytask:copy_security_libs,copytask:copy_security_conf,genjar:warfile
deploy_order=copyfiletask:place_in_tomcat
createzip_order=genzip:output
cleantasks_order=deletetask:clean_local_stage

# Directory Structure
build_dir=.
base_dir=..
src_dir=${base_dir}/src/main/java
web_dir=${base_dir}/src/main/webapp
res_dir=${base_dir}/src/main/resources
base_lib_dir=${web_dir}/WEB-INF/lib

# Security Framework Directory Structure (Based on your reference)
deps_dir=${build_dir}/dependencies
manual_log_lib=${deps_dir}/lib_logs/logsclient/logclient/lib
zohoSecurity_dir=${deps_dir}/zohoSecurity/ZohoSecurity
zohoSecurity_lib_dir=${zohoSecurity_dir}/lib
zohoSecurity_WEB_INF_dir=${zohoSecurity_dir}/webapps/WEB-INF
zohoSecurity_conf_dir=${zohoSecurity_dir}/conf

# Appserver / Tomcat Paths
appserver_dir=${user.home}/IAM_LOCAL/appserver_container
tomcat_dir=${appserver_dir}/AdventNet/Sas/tomcat
webapps_dir=${tomcat_dir}/webapps
servlet_jar=${tomcat_dir}/lib/servlet-api.jar

# NoteBook Staging
build_stage=${build_dir}/${product_name}_build_stage
compile_out=${build_stage}/classes
war_staging=${build_stage}/war_dir
lib_dir=${war_staging}/WEB-INF/lib
conf_dest_dir=${war_staging}/WEB-INF/conf

# Artifact Names
war_name=ROOT.war
zip_name=${product_name}.zip
base_pckg=com/zoho/notebook

# Compile Task
all_srccompile_srcdir=${src_dir}
all_srccompile_includes=${base_pckg}/**
all_srccompile_classes=${compile_out}
all_srccompile_classpath=${servlet_jar}:${base_lib_dir}/HikariCP-5.1.0.jar:${base_lib_dir}/mysql-connector-j-8.2.0.jar:${base_lib_dir}/jackson-databind-2.15.2.jar:${base_lib_dir}/jackson-core-2.15.2.jar:${base_lib_dir}/jackson-annotations-2.15.2.jar:${base_lib_dir}/snakeyaml-2.2.jar:${manual_log_lib}/*.jar
all_srccompile_jar=${build_stage}/all_unused.jar

# JAR Tasks
constants_jartask=${lib_dir}/nb-constants.jar,${compile_out},${base_pckg}/constants/**,
enums_jartask=${lib_dir}/nb-enums.jar,${compile_out},${base_pckg}/enums/**,
model_jartask=${lib_dir}/nb-model.jar,${compile_out},${base_pckg}/model/**,
context_jartask=${lib_dir}/nb-context.jar,${compile_out},${base_pckg}/context/**,
dto_jartask=${lib_dir}/nb-dto.jar,${compile_out},${base_pckg}/dto/**,
cache_jartask=${lib_dir}/nb-cache.jar,${compile_out},${base_pckg}/cache/**,
dao_jartask=${lib_dir}/nb-dao.jar,${compile_out},${base_pckg}/dao/**,
util_jartask=${lib_dir}/nb-util.jar,${compile_out},${base_pckg}/util/**,
service_jartask=${lib_dir}/nb-service.jar,${compile_out},${base_pckg}/service/**,
controller_jartask=${lib_dir}/nb-controller.jar,${compile_out},${base_pckg}/controller/**,
filter_jartask=${lib_dir}/nb-filter.jar,${compile_out},${base_pckg}/filter/**,

# War Tasks
copy_res_copytask=${res_dir},${war_staging}/WEB-INF/classes,**,
copy_web_copytask=${web_dir},${war_staging},**,
copy_log_jars_copytask=${manual_log_lib},${lib_dir},**/*.jar

# --- NEW: Security Framework Tasks ---
# Copies JARs from ZohoSecurity/lib/agent and agent_extension to the WAR lib
copy_security_libs_copytask=${zohoSecurity_lib_dir},${lib_dir},agent/**/*.jar agent_extension/**/*.jar *.jar,zohoinstrumentation.jar

# Copies security-common.xml, security-safeheaders.xml, etc., to WEB-INF/conf
copy_security_conf_copytask=${zohoSecurity_WEB_INF_dir},${conf_dest_dir},**/*.xml
# -------------------------------------

warfile_jar_file=${build_stage}/${war_name}
warfile_jar_srcdir=${war_staging}
warfile_jar_includes=**

# Deploy Task
place_in_tomcat_copyfiletask=${build_stage}/${war_name},${webapps_dir}/${war_name}

# Zip Task
output_genzip=${appserver_dir}/${zip_name},${appserver_dir},.

# Clean Task
clean_local_stage_deletetask=${build_stage},**,
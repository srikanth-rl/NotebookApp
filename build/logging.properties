# 1. Handlers
handlers=java.util.logging.FileHandler, java.util.logging.ConsoleHandler
# 2. Root Level
.level=INFO

# 3. Zoho Mandatory Framework Config
com.zoho.logs.config.project.name=zoho
com.zoho.logs.config.service.name=notebook
com.zoho.logs.config.log.listener.truncate=com.zoho.logs.logclient.v2.listener.NoOPLogListener

# 4. Local Mode Toggle
com.zoho.logs.config.local.logging=true
com.zoho.logs.config.zlogsagent.enabled=false

# 5. Log Locations & Levels (FIXED PATHS)
com.zoho.logs.config.logs.directory=../logs
java.util.logging.FileHandler.pattern=../logs/notebook-local.log

# File Handler Config
java.util.logging.FileHandler.formatter=java.util.logging.SimpleFormatter
java.util.logging.FileHandler.level=FINE
java.util.logging.FileHandler.limit=5000000
java.util.logging.FileHandler.count=5

# Console Handler Config (For Terminal/catalina.out)
java.util.logging.ConsoleHandler.level=FINE
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter

# 6. Specific Package Levels
org.apache.kafka.level=WARNING
com.zoho.scheduler.level=WARNING
com.zoho.notebook.level=FINE